---
# One PolicySet so the whole Falcon stack is placed, reported and
# disabled as a unit. Ordering between the members is expressed with
# spec.dependencies inside each Policy, not by the order listed here.
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: falcon-platform
  namespace: falcon-governance
spec:
  description: >-
    CrowdStrike Falcon Platform Operator v1.15.0 (Red Hat certified) and the
    Falcon sensor custom resources, delivered to local-cluster and every
    managed OpenShift cluster.
  policies:
    - falcon-operator
    - falcon-credentials
    - falcon-node-sensor
    # Optional add-ons. Uncomment here and in acm/kustomization.yaml.
    # - falcon-admission
    # - falcon-image-analyzer
