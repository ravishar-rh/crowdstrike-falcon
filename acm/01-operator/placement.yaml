---
# Where the operator gets installed: local-cluster AND every managed
# OpenShift cluster.
#
# "vendor: OpenShift" is a standard label ACM applies to every imported
# OpenShift cluster, and the hub's local-cluster carries it too, so this one
# Placement covers the hub and the fleet.
#
# Each phase has its own Placement on purpose. You will very likely want the
# operator everywhere but sensors on a subset first -- narrow
# acm/03-sensors/placement.yaml without touching this one.
#
# To exclude the hub, add:
#   - key: local-cluster
#     operator: NotIn
#     values: ["true"]
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: falcon-operator-clusters
  namespace: falcon-governance
spec:
  clusterSets:
    - global
  # Keep placing the policy even when a cluster is temporarily unreachable,
  # so the operator is reasserted the moment the cluster comes back.
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: vendor
              operator: In
              values:
                - OpenShift
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: falcon-platform-operator
  namespace: falcon-governance
placementRef:
  name: falcon-operator-clusters
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: falcon-platform-operator
    apiGroup: policy.open-cluster-management.io
    kind: PolicySet
---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: falcon-platform-operator
  namespace: falcon-governance
spec:
  description: >-
    Phase 1 -- CrowdStrike Falcon Platform Operator v1.15.0 (Red Hat
    certified) installed on local-cluster and every managed OpenShift
    cluster. No credentials and no sensors; this phase stands alone.
  policies:
    - falcon-operator
