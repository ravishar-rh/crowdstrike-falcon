---
# PHASE 2 -- Falcon API credentials.
#
# NOT zero-touch. Before deploying this phase you must have:
#   1. run terraform/ (via the GitHub Actions workflow) to create the AWS
#      secret and grant your existing ESO role read access
#   2. typed the real client_id / client_secret into the Secrets Manager
#      console, replacing the REPLACE_IN_CONSOLE placeholders
#   3. confirmed the existing ClusterSecretStore is healthy:
#      oc get clustersecretstore aws-secrets-manager   -> READY True
#
# Nothing in this directory needs editing: the store already carries the
# region, role and account, so no AWS identifiers live in this repo.
#
# Deploy as its own Argo CD Application pointing at this directory.
#
# Deploying it early is safe but pointless: the ExternalSecret will sit in
# SecretSyncedError against the placeholder role ARN, and the policy
# declares a dependency on phase 1 so it reports Pending until the operator
# is Compliant.
#
# See docs/credentials.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - external-secrets.yaml
  - placement.yaml
  - policy-falcon-credentials.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: crowdstrike-falcon
      app.kubernetes.io/component: credentials
