---
# Copies the Falcon API credentials from the hub into every targeted cluster.
#
# HOW THE CREDENTIAL TRAVELS
# --------------------------
# External Secrets Operator runs on the ACM hub ONLY. It syncs AWS Secrets
# Manager into the Secret falcon-api-credentials in the falcon-governance
# namespace (see acm/02-credentials/external-secrets.yaml). This policy then fans that
# value out to local-cluster and every managed cluster. Managed clusters need
# no AWS access, no IAM role and no ESO install.
#
# WHY THIS IS SAFE
# ----------------
# `fromSecret` output is automatically passed through ACM's `protect`
# function. What actually lands in the replicated Policy is AES ciphertext,
# not the key. ACM holds a distinct encryption key per managed cluster and
# rotates it every 30 days; the value is decrypted on the managed cluster
# immediately before the Secret is written.
#
# Do not "simplify" these to stringData with a plain lookup. That would put
# the Falcon API key in cleartext in a Policy object in hub etcd and in every
# managed cluster namespace on the hub. Policies are not covered by
# OpenShift's etcd encryption.
#
# ROTATION
# --------
# Nothing manual. The policy propagator registers a dynamic watch on every
# object referenced by a hub template, so when ESO updates the hub Secret the
# replicated policies are re-rendered and re-propagated on their own
# (governance-policy-propagator, replicatedpolicy_controller.go -- "dynamic
# watches for the hub policy templates").
#
# To force it anyway -- after an incident, or to confirm the path works:
#   oc annotate policy falcon-credentials -n falcon-governance \
#     policy.open-cluster-management.io/trigger-update="$(date +%s)" --overwrite
#
# NAMESPACE CONSTRAINT
# --------------------
# ACM resolves hub templates only against objects in the Policy's own
# namespace. That is why the ESO-managed Secret is created in
# falcon-governance rather than somewhere more obvious like falcon-operator
# on the hub. (RHACM also offers spec.hubTemplateOptions.serviceAccountName
# to resolve templates as a specific ServiceAccount, which can relax this --
# not used here, because same-namespace is the smaller blast radius.)
#
# KEY NAMES
# ---------
# falcon-client-id and falcon-client-secret are fixed by the operator, which
# reads exactly these keys when spec.falconSecret.enabled is true
# (pkg/falcon_secret/falcon_secret.go in falcon-operator v1.15.0). It also
# supports falcon-cid and falcon-provisioning-token; neither is set here --
# the CID is derived from the API key, and no provisioning token is used.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: falcon-credentials
  namespace: falcon-governance
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: IA Identification and Authentication
    policy.open-cluster-management.io/controls: IA-5 Authenticator Management
spec:
  disabled: false
  remediationAction: enforce
  dependencies:
    # The falcon-operator namespace is created by the operator policy.
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: falcon-operator
      namespace: falcon-governance
      compliance: Compliant
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: falcon-credentials
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: None
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                type: Opaque
                metadata:
                  name: falcon-api-credentials
                  namespace: falcon-operator
                data:
                  falcon-client-id: '{{hub fromSecret "falcon-governance" "falcon-api-credentials" "falcon-client-id" hub}}'
                  falcon-client-secret: '{{hub fromSecret "falcon-governance" "falcon-api-credentials" "falcon-client-secret" hub}}'
