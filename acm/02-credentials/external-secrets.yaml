---
# HUB ONLY. Pulls the Falcon API credentials from AWS Secrets Manager into
# the governance namespace, where
# acm/02-credentials/policy-falcon-credentials.yaml fans them out to
# local-cluster and every managed cluster.
#
# NO ClusterSecretStore HERE ON PURPOSE.
#
# "aws-secrets-manager" is an existing cluster-scoped store, set up by your
# other automation and already syncing secrets for other workloads. This
# file only consumes it. That means the region, the IAM role ARN and the AWS
# account ID all live in that store, not in this repository -- which is what
# keeps a public repo free of anything worth reconnaissance.
#
# Confirm the store is healthy before deploying phase 2:
#   oc get clustersecretstore aws-secrets-manager
#   -> READY should be True
#
# The Secret MUST land in falcon-governance: ACM resolves hub templates only
# against objects in the Policy's own namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falcon-api-credentials
  namespace: falcon-governance
  labels:
    app.kubernetes.io/part-of: crowdstrike-falcon
spec:
  # ESO re-reads AWS on this interval. Rotation is just: change the value in
  # the console, wait. The ACM propagator watches the resulting Secret and
  # re-propagates the credentials policy on its own.
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: falcon-api-credentials
    creationPolicy: Owner

  data:
    # secretKey values are fixed by falcon-operator v1.15.0, which reads
    # exactly these keys when spec.falconSecret.enabled is true.
    #
    # key      = the secret name in Secrets Manager; must equal
    #            var.secret_name in terraform/ (validate.sh checks this).
    # property = the JSON field inside that secret, typed in by hand.
    - secretKey: falcon-client-id
      remoteRef:
        key: crowdstrike/falcon/api-credentials
        property: client_id
    - secretKey: falcon-client-secret
      remoteRef:
        key: crowdstrike/falcon/api-credentials
        property: client_secret
