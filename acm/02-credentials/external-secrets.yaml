---
# HUB ONLY. External Secrets Operator runs on the ACM hub and nowhere else.
# These two objects are the single point where AWS meets the cluster fleet:
# ESO writes the Secret falcon-api-credentials into falcon-governance, and
# acm/02-credentials/policy-falcon-credentials.yaml fans it out from there.
#
# Managed clusters need no ESO, no IAM role and no route to AWS.
#
# The Secret MUST land in falcon-governance -- ACM resolves hub templates
# only against objects in the Policy's own namespace.
#
# FILL IN THE THREE AWS VALUES BELOW (region, role, remoteRef.key) from:
#
#   terraform -chdir=terraform output hub_secret_store_values
#
# This file is hand-written rather than generated so the comments survive
# review. scripts/validate.sh compares it against Terraform state when state
# is reachable, so drift fails a local check rather than an Argo sync.
#
# Safe to commit: a role ARN is an identity and the secret name is a name,
# not a value. No credential material belongs in this file.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: falcon-aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # ESO mints a projected token for the ServiceAccount below and calls
      # AssumeRoleWithWebIdentity against this role. No static AWS keys.
      role: arn:aws:iam::000000000000:role/falcon-eso-hub
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falcon-api-credentials
  namespace: falcon-governance
spec:
  # When this fires and the value has changed, the ACM propagator's dynamic
  # watch on the Secret re-renders and re-propagates the credentials policy
  # automatically. This interval is the whole rotation story.
  refreshInterval: 1h
  secretStoreRef:
    name: falcon-aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: falcon-api-credentials
    creationPolicy: Owner
  data:
    # secretKey values are fixed by falcon-operator. The property values are
    # the JSON keys inside the AWS Secrets Manager payload, written by
    # scripts/bw-to-aws.sh.
    - secretKey: falcon-client-id
      remoteRef:
        key: crowdstrike/falcon/api-credentials
        property: client_id
    - secretKey: falcon-client-secret
      remoteRef:
        key: crowdstrike/falcon/api-credentials
        property: client_secret
