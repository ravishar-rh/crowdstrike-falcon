---
# Everything Argo CD applies to the ACM hub.
#
# Plain manifests on purpose -- no ACM PolicyGenerator. The generator is the
# other common choice, but it needs kustomize alpha plugins enabled in the
# openshift-gitops repo-server, and it means the YAML in Git is not the YAML
# that gets applied. For a security control that auditors will read, the
# tradeoff favours "what you see is what runs" over brevity.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base/namespace.yaml
  - base/placement.yaml
  - base/policyset.yaml

  # Hub-local, not an ACM policy: ESO runs only on the hub and pulls the
  # credentials from AWS into the governance namespace. The policies below
  # fan that Secret out to the fleet.
  - hub/external-secrets.yaml

  - policies/policy-falcon-credentials.yaml
  - policies/policy-falcon-operator.yaml
  - policies/policy-falcon-node-sensor.yaml
  # Optional add-ons -- also uncomment them in base/policyset.yaml.
  # - policies/optional/policy-falcon-admission.yaml
  # - policies/optional/policy-falcon-image-analyzer.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: crowdstrike-falcon
      app.kubernetes.io/managed-by: openshift-gitops
