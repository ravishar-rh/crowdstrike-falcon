---
# Creates the AWS Secrets Manager secret and its KMS key.
#
# Never handles the Falcon credential. Terraform writes a REPLACE_IN_CONSOLE
# placeholder once and then ignores the value; the real client ID and secret
# are typed into the Secrets Manager console by hand. So nothing secret
# appears in this workflow, its logs, or Terraform state -- which is what
# allows this repository to be public.
#
# AUTHENTICATION: OIDC federation, no stored AWS keys. You need an IAM role
# trusting GitHub's OIDC provider, restricted to this repository. See
# terraform/README.md.
#
# REPOSITORY VARIABLES (Settings -> Secrets and variables -> Actions -> Variables).
# None are secret; they are variables rather than secrets only so they stay
# out of the public source tree:
#   AWS_ROLE_ARN      role this workflow assumes
#   AWS_REGION        eu-west-1
#   TF_STATE_BUCKET   existing S3 bucket for state
#   TF_STATE_REGION   region of that bucket
#   ESO_ROLE_ARNS     JSON list of the IAM role(s) your existing External
#                     Secrets Operator assumes, granted read on the secret.
#                     Must be valid HCL/JSON for a list variable, e.g.
#                       ["arn:aws:iam::123456789012:role/external-secrets"]
#                     Kept as a repository variable rather than committed so
#                     the public tree names no real IAM role.
name: terraform

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

# Least privilege. id-token is what makes OIDC work; contents: read is all
# the checkout needs.
permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  # Never let two applies race on the same state.
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  # Terraform reads TF_VAR_* automatically, so the role ARN reaches the
  # config without ever being committed.
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_eso_role_arns: ${{ vars.ESO_ROLE_ARNS }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-crowdstrike-falcon

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=crowdstrike-falcon/terraform.tfstate" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            // Keep the comment under GitHub's 65536-char limit.
            if (plan.length > 60000) plan = plan.slice(-60000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### terraform plan\n\`\`\`terraform\n${plan}\n\`\`\``,
            });

      - name: terraform apply
        # Only from main, never from a pull_request event -- a PR from a
        # fork must never be able to apply.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Where to set the credential
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          {
            echo "### Falcon credential"
            echo
            echo "Set the value by hand in the AWS console:"
            echo
            echo "- $(terraform output -raw set_value_console_url)"
            echo
            echo '```'
            terraform output -raw next_step
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
