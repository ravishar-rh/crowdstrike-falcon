---
# Grants the openshift-gitops Argo CD controller the rights to manage ACM
# governance objects. Out of the box it cannot touch them, and the Application
# fails with "policies.policy.open-cluster-management.io is forbidden".
#
# Apply this once, by hand or from a cluster-bootstrap repo -- it is a
# prerequisite for the Application, so it cannot be managed by the Application.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshift-gitops-acm-governance
rules:
  - apiGroups:
      - policy.open-cluster-management.io
    resources:
      - policies
      - policysets
      - placementbindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups:
      - cluster.open-cluster-management.io
    resources:
      - placements
      - managedclustersetbindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Creating a ManagedClusterSetBinding additionally requires the "bind" verb
  # on the ManagedClusterSet itself. This is a virtual subresource -- the
  # rule above is not sufficient on its own.
  - apiGroups:
      - cluster.open-cluster-management.io
    resources:
      - managedclustersets/bind
    resourceNames:
      - global
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-gitops-acm-governance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openshift-gitops-acm-governance
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
