---
# FALLBACK ONLY -- try without this first.
#
# Phase 1 labels the falcon-governance namespace with
# argocd.argoproj.io/managed-by, which makes the OpenShift GitOps operator
# grant Argo CD full rights inside that namespace. Every Policy, PolicySet,
# PlacementBinding and Placement in this repo is namespaced there, so that
# label alone normally resolves the "cannot patch resource" errors with no
# ClusterRole at all.
#
# Apply this only if something still fails after phase 1 has synced once.
#
# Two reasons it might:
#
# 1. managedclustersets/bind. ACM requires the "bind" verb on the target
#    ManagedClusterSet to create a ManagedClusterSetBinding. ManagedClusterSet
#    is cluster-scoped, so a namespace Role cannot grant it. This is the
#    usual remaining gap, and the first rule below is the whole fix.
#
# 2. Your Argo CD instance is not the default openshift-gitops one, or the
#    managed-by label was stripped by a namespace-governance policy.
#
# WHY THIS IS NOT IN THE SYNCED TREE
# ----------------------------------
# It cannot be. Kubernetes RBAC forbids privilege escalation: to create a
# ClusterRole granting permissions, you must already hold those permissions
# or have the "escalate" verb. An Argo CD that cannot patch policies also
# cannot create a ClusterRole that lets it patch policies -- the API server
# rejects it with "attempt to grant extra privileges". Self-bootstrapping
# RBAC is impossible by design, which is exactly the property that makes
# RBAC worth anything.
#
# Apply it with an account that is already cluster-admin:
#   oc apply -f prereqs/openshift-gitops-acm-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshift-gitops-acm-governance
rules:
  # The one thing a namespace Role cannot cover. Scoped to the single
  # ManagedClusterSet this repo binds.
  - apiGroups:
      - cluster.open-cluster-management.io
    resources:
      - managedclustersets/bind
    resourceNames:
      - global
    verbs: ["create"]

  # Belt and braces for case 2 above -- harmless when the managed-by label
  # is already doing the work, since these duplicate what the namespace
  # Role grants.
  - apiGroups:
      - policy.open-cluster-management.io
    resources:
      - policies
      - policysets
      - placementbindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups:
      - cluster.open-cluster-management.io
    resources:
      - placements
      - managedclustersetbindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-gitops-acm-governance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openshift-gitops-acm-governance
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
